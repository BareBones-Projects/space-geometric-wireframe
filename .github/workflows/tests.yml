# BareBones Project | GitHub Actions test workflow
name: BareBones Project Wireframe CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run static tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text()
          Path('/tmp/wireframe.js').write_text(text.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/wireframe.js
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run browser smoke
        run: python tests/browser_smoke.py
